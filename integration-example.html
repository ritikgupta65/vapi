<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceSDK — Integration Example</title>
    <style>
        /* ─── Reset ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f0e8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ─── Chat Container ─── */
        .chat-container {
            width: 420px;
            height: 700px;
            background: #fffdf7;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ─── Header ─── */
        .chat-header {
            background: linear-gradient(135deg, #e8b84b, #d4a03c);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .chat-header .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-header .info {
            flex: 1;
        }
        .chat-header .info h3 {
            font-size: 16px;
            font-weight: 600;
        }
        .chat-header .info span {
            font-size: 12px;
            opacity: 0.85;
        }

        .new-chat-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .new-chat-btn:hover { background: rgba(255,255,255,0.3); }

        /* ─── Messages ─── */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            animation: fadeIn 0.2s ease;
            position: relative;
        }

        .message .time {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #e8b84b, #d4a03c);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: #f5f0e8;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.ai .avatar-inline {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e8b84b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            margin-right: 6px;
            vertical-align: middle;
        }

        .message.interim {
            align-self: flex-end;
            background: rgba(232, 184, 75, 0.15);
            color: #999;
            border: 1px dashed #e8b84b;
            font-style: italic;
            border-bottom-right-radius: 4px;
        }

        .message.thinking {
            align-self: flex-start;
            background: #f5f0e8;
            color: #999;
            font-style: italic;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        .error-toast {
            align-self: center;
            background: #fee;
            color: #c00;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* ─── Input Area ─── */
        .chat-input-area {
            padding: 12px 16px 20px;
            background: #fffdf7;
            border-top: 1px solid #f0e8d8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            border: 2px solid #e8d8b8;
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 14px;
            outline: none;
            background: #fffdf7;
            color: #333;
        }
        .chat-input-area input:focus { border-color: #e8b84b; }
        .chat-input-area input::placeholder { color: #bbb; }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #e8b84b;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover { background: #fdf5e3; }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #e8b84b;
            transition: fill 0.2s;
        }

        .icon-btn.call-active {
            background: #e53e3e;
            border-color: #e53e3e;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .icon-btn.call-active svg { fill: white; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(229,62,62,0.4); }
            50%      { box-shadow: 0 0 0 10px rgba(229,62,62,0); }
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #e8b84b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover { background: #d4a03c; }
        .send-btn svg { width: 18px; height: 18px; fill: white; }

        /* ─── Status Bar ─── */
        .status-bar {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 4px;
            background: #fdf5e3;
            display: none;
        }
        .status-bar.visible { display: block; }
        .status-bar.listening { color: #e8b84b; }
        .status-bar.thinking  { color: #888; }
        .status-bar.speaking  { color: #4caf50; }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <button class="back-btn">&larr;</button>
        <div class="avatar">🔥</div>
        <div class="info">
            <h3>Bruchi Club</h3>
            <span id="headerStatus">Online</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">+ New chat</button>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar"></div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages"></div>

    <!-- Input -->
    <div class="chat-input-area">
        <!-- Call Button -->
        <button class="icon-btn" id="callBtn" title="Voice call">
            <svg viewBox="0 0 24 24">
                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
            </svg>
        </button>

        <input type="text" id="textInput" placeholder="Type your message..." />

        <!-- Attach (placeholder) -->
        <button class="icon-btn" title="Attach" style="opacity:0.4;cursor:default;">
            <svg viewBox="0 0 24 24">
                <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6h-1.5v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6H16.5z"/>
            </svg>
        </button>

        <!-- Send Button -->
        <button class="send-btn" id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- INTEGRATION: Only the code below is needed in YOUR app -->
<!-- ═══════════════════════════════════════════════════════ -->

<!-- Step 1: Include the SDK (from your deployed voice server) -->
<script src="/voicesdk.js"></script>

<script>
// ───────────────────────────────────────────────────────
// Step 2: Initialize VoiceSDK (ONLY CONFIG YOU NEED)
// ───────────────────────────────────────────────────────
const voice = new VoiceSDK({
    serverUrl: window.location.origin,

    // Your AI's personality/instructions
    systemPrompt: `You are Korakari, a friendly and helpful AI assistant for Bruchi Club.
You assist customers with their queries about club membership, events, and services.
Keep responses concise (2-3 sentences max) since this is a voice conversation.
Be warm, professional and helpful.`,

    // Optional: auto-greeting on first call
    greeting: 'Hello! Welcome to Bruchi Club. How can I assist you today?',

    // Called when user finishes speaking
    onUserTranscript: function (text) {
        removeThinking();
        addMessage(text, 'user');
    },

    // Called when AI responds
    onAIResponse: function (text) {
        removeThinking();
        addMessage(text, 'ai');
    },

    // Called on state changes: 'idle' | 'listening' | 'thinking' | 'speaking'
    onStateChange: function (state) {
        updateStatus(state);
        if (state === 'thinking') showThinking();
    },

    // Called with partial/interim speech text
    onInterim: function (text) {
        if (text) showInterim(text);
        else removeInterim();
    },

    // Error handling
    onError: function (err) {
        showError(err.message);
    }
});

// ───────────────────────────────────────────────────────
// Step 3: Connect to your UI buttons (2 lines!)
// ───────────────────────────────────────────────────────

// Voice call button
document.getElementById('callBtn').onclick = function () {
    voice.toggleCall();
    this.classList.toggle('call-active', voice.isActive());
};

// Text send button
document.getElementById('sendBtn').onclick = sendTextMessage;
document.getElementById('textInput').onkeydown = function (e) {
    if (e.key === 'Enter') sendTextMessage();
};

function sendTextMessage() {
    var input = document.getElementById('textInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    voice.sendText(text);
}

// New chat
document.getElementById('newChatBtn').onclick = function () {
    document.getElementById('chatMessages').innerHTML = '';
    voice.clearHistory();
    if (voice.isActive()) {
        voice.endCall();
        document.getElementById('callBtn').classList.remove('call-active');
    }
};

// ───────────────────────────────────────────────────────
// UI Helpers (your app's own code, not part of SDK)
// ───────────────────────────────────────────────────────

function addMessage(text, type) {
    var container = document.getElementById('chatMessages');
    var div = document.createElement('div');
    div.className = 'message ' + type;

    var now = new Date();
    var time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    if (type === 'ai') {
        div.innerHTML = '<span class="avatar-inline">K</span>' + escapeHtml(text) +
                        '<div class="time">' + time + '</div>';
    } else {
        div.innerHTML = escapeHtml(text) + '<div class="time">' + time + '</div>';
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

var interimDiv = null;
function showInterim(text) {
    var container = document.getElementById('chatMessages');
    if (!interimDiv) {
        interimDiv = document.createElement('div');
        interimDiv.className = 'message interim';
        container.appendChild(interimDiv);
    }
    interimDiv.textContent = text;
    container.scrollTop = container.scrollHeight;
}
function removeInterim() {
    if (interimDiv) { interimDiv.remove(); interimDiv = null; }
}

function showThinking() {
    removeThinking();
    var container = document.getElementById('chatMessages');
    var div = document.createElement('div');
    div.className = 'message thinking';
    div.id = 'thinkingMsg';
    div.innerHTML = '<span class="avatar-inline">K</span> typing...';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}
function removeThinking() {
    var el = document.getElementById('thinkingMsg');
    if (el) el.remove();
}

function showError(msg) {
    var container = document.getElementById('chatMessages');
    var div = document.createElement('div');
    div.className = 'error-toast';
    div.textContent = '⚠ ' + msg;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    setTimeout(function () { div.remove(); }, 5000);
}

function updateStatus(state) {
    var bar = document.getElementById('statusBar');
    var header = document.getElementById('headerStatus');
    bar.className = 'status-bar';

    if (state === 'idle') {
        bar.classList.remove('visible');
        header.textContent = 'Online';
    } else if (state === 'listening') {
        bar.classList.add('visible', 'listening');
        bar.textContent = '🎤 Listening...';
        header.textContent = 'On call';
    } else if (state === 'thinking') {
        bar.classList.add('visible', 'thinking');
        bar.textContent = '💭 Thinking...';
        header.textContent = 'On call';
    } else if (state === 'speaking') {
        bar.classList.add('visible', 'speaking');
        bar.textContent = '🔊 Speaking...';
        header.textContent = 'On call';
    }
}

function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}
</script>

</body>
</html>
